name: Images

# Builds the backend images in CI so the (small, shared) deploy VM only ever
# `docker pull`s — it never runs a build. The dashboard isn't built here: it
# deploys to Vercel (its Dockerfile stays for local/self-hosted use).
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - apps/generator/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.base.json
      - .trivyignore
      - .github/workflows/images.yml
  # monthly: DB-IP publishes a new GeoIP database at the start of each month
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>
    strategy:
      fail-fast: false
      matrix:
        app: [api, generator]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image name
        id: image
        # GHCR names must be lowercase; owner names often aren't
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/argus-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      # DB-IP Lite is monthly; early in a month the new file may not be up yet,
      # so fall back to last month's. Only the api uses it.
      - name: GeoIP database URL
        id: geoip
        if: matrix.app == 'api'
        run: |
          for month in "$(date -u +%Y-%m)" "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"; do
            url="https://download.db-ip.com/free/dbip-country-lite-${month}.mmdb.gz"
            if curl -sfI "$url" >/dev/null; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::warning::no DB-IP database reachable — the image ships without GeoIP"

      - uses: docker/setup-buildx-action@v4

      # 1) build into the local daemon only — nothing is published yet
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            GEOIP_DB_URL=${{ steps.geoip.outputs.url }}
          platforms: linux/amd64 # the deploy VM; add linux/arm64 if it ever changes
          load: true
          tags: ${{ steps.image.outputs.name }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # 2) scan the exact image (OS packages + node_modules) before it can ship
      - name: Install trivy (checksum-pinned)
        run: |
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy && rm trivy.tgz
      - name: Gate on fixable critical vulnerabilities
        run: |
          ./trivy image --severity HIGH,CRITICAL --ignore-unfixed "${{ steps.image.outputs.name }}:scan"
          ./trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "${{ steps.image.outputs.name }}:scan"

      # 3) only now publish — same layers from cache, plus an SBOM and SLSA
      #    provenance attestation attached to the image in the registry
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            GEOIP_DB_URL=${{ steps.geoip.outputs.url }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          sbom: true
          provenance: mode=max

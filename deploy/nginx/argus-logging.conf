# Argus access logging — http-level pieces (installed to /etc/nginx/conf.d/ by
# `./deploy/vm.sh probes`; used by snippets/argus-access-log.conf in the site).

# Ops log without query strings: the dashboard's WebSocket authenticates with
# ?token=<session JWT>, and the default "combined" format would write every
# visitor's session token to disk in plain text.
log_format argus_noargs '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" $request_time';

# Probe = a request for a path the api doesn't serve. Real dashboard users only
# ever hit the api's routes, so only scanners and exploit kits (/.env,
# /wp-login.php, /cgi-bin/…) land in probes.log — the file the generator ships
# into Argus as real attack traffic. $uri is the normalized path, so tricks
# like /incidents/../.env still count as probes.
map $uri $argus_probe {
    default                                          1;
    ~^/(favicon\.ico|robots\.txt)?$                  0;
    ~^/(healthz|metrics|users|ws|soc-metrics|ingest)$ 0;
    ~^/(auth|incidents|events|system|simulate|admin)(/|$) 0;
}

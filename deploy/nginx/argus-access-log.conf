# Argus server-level logging (installed to /etc/nginx/snippets/; included from
# the api.argus.buzz server block). Replaces the inherited global access_log for
# this site only — other sites on the box are untouched.

# everything, for ops — paths only, never query strings (session tokens)
access_log /var/log/nginx/argus/access.log argus_noargs;

# only probes, full request line (attack payloads live in the query string) —
# shipped into the pipeline by the generator (SHIP_NGINX_LOG)
access_log /var/log/nginx/argus/probes.log combined if=$argus_probe;

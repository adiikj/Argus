# Host nginx in front of deploy/docker-compose.vm.yml — for a VM that already runs
# nginx on :80/:443 for other apps (so the bundled Caddy can't bind them).
#
#   sudo cp deploy/nginx/argus.conf /etc/nginx/sites-available/argus.conf
#   sudo sed -i 's/argus.example.com/<your API_HOST>/g' /etc/nginx/sites-available/argus.conf
#   sudo ln -s /etc/nginx/sites-available/argus.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <your API_HOST>      # adds the TLS server block
#
# Needs conf.d/argus-logging.conf + snippets/argus-access-log.conf first —
# `./deploy/vm.sh probes` installs both (and adds the include below to an
# existing, certbot-edited site file without rewriting it).
#
# The containers listen on 127.0.0.1 only (API_HOST_PORT / GENERATOR_HOST_PORT
# in .env.vm — change the upstreams below if you changed those).

# WebSocket upgrade: send "Connection: upgrade" only when the client asked for it
map $http_upgrade $argus_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream argus_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream argus_generator {
    server 127.0.0.1:4200;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name argus.example.com;

    server_tokens off;
    include /etc/nginx/snippets/argus-access-log.conf;
    client_max_body_size 64k; # the api only ever takes small JSON bodies

    # overwrite, never append: a client-sent X-Forwarded-For must not reach the
    # api — it would be one more (forged) entry for the trust check to see
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;

    # attack-simulator API (generator)
    location /simulate {
        proxy_set_header Connection "";
        proxy_pass http://argus_generator;
    }

    # live feed WebSocket — long-lived, so no 60s idle cut-off
    location = /ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $argus_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://argus_api;
    }

    # api REST
    location / {
        proxy_set_header Connection "";
        proxy_pass http://argus_api;
    }
}
